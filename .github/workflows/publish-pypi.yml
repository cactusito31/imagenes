name: publish-pypi

# Se dispara cuando publicas una Release en GitHub.
# Requiere configurar un "trusted publisher" en PyPI para este repo:
#   https://docs.pypi.org/trusted-publishers/adding-a-publisher/
#   Proyecto: imagenes | Owner: cactusito31 | Repo: imagenes
#   Workflow: publish-pypi.yml | Environment: pypi
# Mientras no este configurado, este job fallara sin afectar a la Release.

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construir sdist y wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publicar en PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
