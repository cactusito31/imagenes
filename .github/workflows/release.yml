name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install "Pillow>=11.3" pillow-heif pyinstaller pytest

      - name: Pruebas
        run: python -m pytest tests -q

      - name: Compilar ejecutable
        run: python -m PyInstaller --clean --noconfirm imagenes.spec

      - name: Renombrar con la version
        shell: bash
        run: cp dist/imagenes.exe "dist/imagenes-${GITHUB_REF_NAME}-windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/imagenes-*-windows-x64.exe

  build-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construir sdist y wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Comprobar los paquetes
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  release:
    needs: [build-exe, build-dist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/exe/*
            artifacts/dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
